version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: expense_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker_password
      POSTGRES_DB: expense_tracker_db
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expense_tracker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_tracker -d expense_tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_tracker_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: expense_tracker
      DB_PASSWORD: expense_tracker_password
      DB_NAME: expense_tracker_db
      DATABASE_URL: postgresql://expense_tracker:expense_tracker_password@postgres:5432/expense_tracker_db
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expense_tracker_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  expense_tracker_network:
    driver: bridge
